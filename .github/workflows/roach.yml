name: Roach Loop Assurance
on: [push, pull_request]
jobs:
 verify:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
     with: {fetch-depth: 0}
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python -m unittest discover -s tests -v
   - name: Verify project record when initialized
     run: |
      if [ -f .roach/state.json ]; then python scripts/roach.py verify-project; else echo "Core tests passed."; fi
